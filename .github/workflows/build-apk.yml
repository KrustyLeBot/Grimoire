# Do not rename this file: GitHub numbers runs per workflow file and the run number is the build number of both apps.
name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    # The release key only exists in the `release` environment, restricted to main.
    # Pull requests never get it, so they can never produce a signed APK.
    environment: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'release' || null }}
    outputs:
      signed: ${{ steps.key.outputs.signed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.GRIMOIRE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            # Tolerates line breaks, CRLF and certutil's BEGIN/END lines around the base64.
            printf '%s' "$KEYSTORE_B64" | grep -v -- '-----' | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/grimoire.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "GRIMOIRE_KEYSTORE=$RUNNER_TEMP/grimoire.jks" >> "$GITHUB_ENV"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No release key: the code is still compiled and tested, but nothing is uploaded or published."
          fi

      - name: Unit tests and APK
        env:
          GRIMOIRE_KEYSTORE_PASSWORD: ${{ secrets.GRIMOIRE_KEYSTORE_PASSWORD }}
          GRIMOIRE_KEY_ALIAS: grimoire
          GRIMOIRE_KEY_PASSWORD: ${{ secrets.GRIMOIRE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/grimoire.jks"

      - name: Refuse an unsigned release
        if: steps.key.outputs.signed != 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          echo "::error::GRIMOIRE_KEYSTORE_BASE64 is missing in the 'release' environment: no unsigned release is ever published."
          exit 1

      - name: Name the APK
        if: steps.key.outputs.signed == 'true'
        run: cp app/build/outputs/apk/release/app-release.apk grimoire.apk

      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.signed == 'true'
        with:
          name: grimoire-android
          path: grimoire.apk
          retention-days: 7

  # Windows app: tests, then a single-file exe (every event; published only with the signed APK).
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: windows/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller pytest
      - name: Stamp the build number (same as the Android version code)
        shell: bash
        run: echo "BUILD = ${{ github.run_number }}" > grimoire_win/_version.py
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q
      - name: Build the exe
        # grimoire.spec keeps only the parts of Qt the app uses (see its comments).
        run: pyinstaller --noconfirm grimoire.spec
      - name: Size of the exe
        shell: bash
        run: ls -l dist/Grimoire.exe | awk '{ printf "Grimoire.exe: %.1f Mo\n", $5 / 1000000 }'
      - uses: actions/upload-artifact@v4
        with:
          name: grimoire-windows
          path: windows/dist/Grimoire.exe
          retention-days: 7

  # One "latest" release carrying both apps, published only when both builds succeeded.
  release:
    needs: [apk, windows]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.apk.outputs.signed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish rolling release `latest`
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest dist/grimoire-android/grimoire.apk dist/grimoire-windows/Grimoire.exe \
            --target "$GITHUB_SHA" \
            --title "Grimoire build ${{ github.run_number }}" \
            --notes "Automatic build ${{ github.run_number }} of ${GITHUB_SHA::7}." \
            --latest
